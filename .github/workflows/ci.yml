name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno fmt --check
      - run: cargo fmt --check

      - run: cargo build
      - run: cargo test
      - run: cargo doc

      # release: x86_64-unknown-linux-gnu
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: pm-tc-x86_64-unknown-linux-gnu
          path: target/release/pm-tc

      # TODO

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - run: cargo build
      - run: cargo test

      # release: x86_64-pc-windows-msvc
      - run: cargo build --release
      - uses: actions/upload-artifact@v7
        with:
          name: pm-tc-x86_64-pc-windows-msvc
          path: target/release/pm-tc.exe
