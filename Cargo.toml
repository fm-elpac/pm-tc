[package]
name = "pm-tc"
version = "0.1.0-a1"
edition = "2024"
license = "MIT"

authors = ["secext2022 <secext2022@outlook.com>"]
description = "胖喵模板配置工具. Template config tool."
repository = "https://github.com/fm-elpac/pm-tc"
keywords = ["template", "config", "tool", "toml"]
categories = ["template-engine", "config", "command-line-utilities"]

[dependencies]
pm-bin = "^0.2.1"

log = "^0.4.35"
serde = { version = "^1.0.229", features = ["derive"] }
serde_json = "^1.0.154"
serde_with = "^3.24.0"
toml_edit = { version = "^0.25.18", features = ["serde"] }
#toml = "^1.2.0"
icu_normalizer = "^2.4.0"
chrono = "^0.4.45"

[features]
default = ["cli"]

cli = ["task", "f"]
task = []
f = []

[build-dependencies]
pm-bin = { version = "^0.2.1", features = ["build"] }

[profile.release]
strip = true
lto = true
